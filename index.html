<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Formulario de contacto</h2>
        <form id="contactoForm" action="#" method="POST">
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
            </div>

            <div class="form-group">
                <label for="telefono">Tel:</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ingresa tu número de teléfono">
            </div>

            <div class="form-group">
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" name="comentario" rows="4" required placeholder="Escribe tu mensaje o comentario aquí..."></textarea>
            </div>

            <!-- SECCIÓN CAPTCHA (TEXTO DISTORSIONADO) -->
            <div class="form-group">
                <label for="captcha-input">Captcha:</label>
                <div class="captcha-box">
                    <div id="captcha-code" class="captcha-code"></div>
                    <button type="button" id="btn-refresh" class="btn-refresh" title="Actualizar código">🔄</button>
                </div>
                <input type="text" id="captcha-input" placeholder="Ingresa el código mostrado" required autocomplete="off">
            </div>

            <!-- BOTONES -->
            <div class="button-group">
                <button type="submit" class="btn-submit">Enviar</button>
                <button type="reset" class="btn-reset">Limpiar</button>
            </div>

            <!-- MAPA -> UATV -->
            <div class="form-group" style="margin-top: 20px;">
                <label>Ubicación (UATV):</label>
                <div class="map-container">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4238.155102021087!2d-98.44893033037692!3d18.04406489237418!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85cf29f0b416a3cb%3A0x317bc639516bab8e!2sUnidad%20Academica%20Tulcingo%20de%20Valle!5e1!3m2!1ses-419!2smx!4v1790876450242!5m2!1ses-419!2smx" 
                        width="100%" 
                        height="220" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="strict-origin-when-cross-origin">
                    </iframe>
                </div>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
